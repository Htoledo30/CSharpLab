name: release

# A cada envio para main: compila e testa. Ao enviar uma tag v1.2.3, também publica o zip numa Release do GitHub.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Testes
        run: dotnet test CSharpLab.slnx -c Release

      - name: Testes do instalador
        shell: pwsh
        run: ./tests/Installer.Tests.ps1

      - name: Pacote
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_REF.TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            if ($env:GITHUB_REF_TYPE -eq 'tag') { throw 'A tag deve ter o formato v1.2.3.' }
            $version = "1.0.0"
          }
          ./build/publish.ps1 -Version $version -UpdateRepository $env:GITHUB_REPOSITORY

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            artifacts/CSharpLab-win-x64.zip
            artifacts/CSharpLab-win-x64.zip.sha256
          body: |
            Baixe **CSharpLab-win-x64.zip**, extraia e rode **Instalar.cmd**.
            Para executar programas é preciso o SDK .NET 10: https://dotnet.microsoft.com/pt-br/download/dotnet/10.0
