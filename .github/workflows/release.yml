name: release

# Ao enviar uma tag v1.2.3, compila, testa e publica o zip do CSharp Lab numa Release do GitHub.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Testes
        run: dotnet test CSharpLab.slnx -c Release

      - name: Pacote
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+') { $version = "1.0.0" }
          ./build/publish.ps1 -Version $version

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/CSharpLab-win-x64.zip
          body: |
            Baixe **CSharpLab-win-x64.zip**, extraia e rode **Instalar.cmd**.
            Para executar programas é preciso o SDK .NET 10: https://dotnet.microsoft.com/pt-br/download/dotnet/10.0
